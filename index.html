<title>Far Ember</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Far Ember. Layout: full-screen 3D board; HUD hugs the edges in chamfered glass panels; menus sit over a live 3D scene.
   Brand: deep-space navy, ember orange, cool white type; Michroma for the wordmark, Chakra Petch for heads, Barlow for text. */
:root {
  color-scheme: dark;
  --ink: #e9edf3;
  --muted: #9aa6b8;
  --dim: #66708a;
  --glass: rgba(8, 12, 21, 0.78);
  --glass-hi: rgba(14, 20, 33, 0.94);
  --line: rgba(170, 200, 255, 0.14);
  --line-hi: rgba(170, 200, 255, 0.3);
  --cut: 10px;
  --ember: #ff8a3d;
  --ember-hi: #ffb37a;
  --ember-deep: #b8501b;
  --pale: #86ecf3;
  --good: #8ad86f;
  --bad: #ff5d50;
  --warn: #ffcb52;
  --move: #4fb0f7;
  --dash: #f2b63f;
  --f-logo: 'Michroma', 'Arial Black', sans-serif;
  --f-head: 'Chakra Petch', 'Arial Narrow', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #06080d; color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ember-hi); outline-offset: 2px; }
svg { display: block; }

/* ---------- floating labels over units ---------- */
#labels, #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.plate { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity .2s; }
.plate .icons { display: flex; gap: 3px; }
.plate .icons span { width: 18px; height: 18px; border-radius: 4px; background: rgba(10,14,12,.8); border: 1px solid var(--line-hi); display: grid; place-items: center; color: var(--ink); }
.plate .icons span svg { width: 12px; height: 12px; }
.plate .cov { font-style: normal; display: grid; place-items: center; width: 100%; height: 100%; }
.plate .cov.full { color: #7fd0ff; }
.plate .cov.half { color: #7fd0ff; opacity: .7; }
.plate .cov.flank { color: var(--warn); font: 800 13px/1 var(--f-head); }
.pips { display: flex; gap: 1px; padding: 2px; background: rgba(8,10,9,.7); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
.pips i { width: var(--pw, 6px); height: 6px; border-radius: 1px; background: #6fc46a; }
.pips i.lost { background: rgba(255,255,255,.12); }
.pips i.shield { background: #c3a4ff; }
.plate.pale .pips i { background: #e05a4a; }
.plate.pale { opacity: .9; }
.plate.pale .pips i.lost { background: rgba(255,255,255,.12); }
.plate.pale .pips i.shield { background: #c3a4ff; }
.plate .tag { font: 600 11px/1 var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-shadow: 0 1px 3px #000; }
.pop { position: absolute; transform: translate(-50%, -100%); font: 800 32px/1 var(--f-head); letter-spacing: .02em; -webkit-text-stroke: 1.5px rgba(0,0,0,.85); paint-order: stroke fill; text-shadow: 0 2px 8px rgba(0,0,0,.9); white-space: nowrap; animation: pop 1.6s ease-out forwards; }
.pop.dmg { color: #ffd2c8; }
.pop.crit { color: var(--warn); font-size: 38px; }
.pop.miss { color: #d4d8d2; font-size: 22px; }
.pop.heal { color: var(--good); }
.bark { position: absolute; transform: translate(-50%, -100%); padding: 6px 11px 7px; background: rgba(8,12,21,.88); border: 1px solid rgba(170,200,255,.22); border-left: 3px solid var(--ember); font: 500 14px/1.25 var(--f-body); color: var(--ink); white-space: nowrap; pointer-events: none; z-index: 3;
  clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px); animation: bark 2.5s ease-out forwards; }
.bark b { display: block; font: 700 10px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--ember-hi); margin-bottom: 3px; }
@keyframes bark { 0% { opacity: 0; transform: translate(-50%, -80%); } 10% { opacity: 1; transform: translate(-50%, -100%); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -112%); } }
.pop.info { color: var(--ink); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
@keyframes pop { 0% { opacity: 0; margin-top: 8px; } 12% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -18px; } }

/* ---------- battle HUD ---------- */
#hud[hidden] { display: none !important; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.glass { position: relative; background: linear-gradient(180deg, rgba(120,160,230,.06), rgba(120,160,230,0) 40%), var(--glass); border: 1px solid var(--line); border-radius: 2px; backdrop-filter: blur(10px) saturate(1.1); -webkit-backdrop-filter: blur(10px) saturate(1.1); box-shadow: 0 6px 24px rgba(0,0,0,.35);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.glass::before { content: ''; position: absolute; top: 0; left: calc(var(--cut) + 6px); width: 28px; height: 2px; background: var(--ember); opacity: .85; pointer-events: none; }
#mission { position: absolute; top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); padding: 10px 14px 11px; max-width: min(380px, 52vw); }
#mission .op { font: 700 12px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--ember-hi); }
#mission .obj { margin-top: 6px; font-size: 14px; line-height: 1.35; color: var(--ink); }
#mission .turn { margin-top: 6px; font: 600 13px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#topright { position: absolute; top: calc(12px + var(--sat)); right: calc(12px + var(--sar)); display: flex; gap: 8px; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 10px; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:active { transform: scale(.96); }
#banner { position: absolute; left: 50%; top: calc(18% + var(--sat)); transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s; }
#banner.show { opacity: 1; }
#banner .t { font: 800 clamp(30px, 5vw, 54px)/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 3px 18px rgba(0,0,0,.8); }
#banner .s { margin-top: 8px; font: 600 14px/1 var(--f-head); letter-spacing: .28em; text-transform: uppercase; color: var(--ember-hi); text-shadow: 0 2px 10px rgba(0,0,0,.9); }
#banner .rule { width: 220px; height: 2px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, var(--ember), transparent); }
#banner.enemy .s { color: var(--pale); }
#banner.enemy .rule { background: linear-gradient(90deg, transparent, var(--pale), transparent); }

#bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal)); display: flex; align-items: flex-end; gap: 12px; pointer-events: none; }
#bottom > * { pointer-events: auto; }
#squad { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; max-width: 46vw; }
.card { position: relative; width: 66px; padding: 6px 5px 6px; border-radius: 8px; border: 1px solid transparent; background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.card.sel { border-color: var(--ember); background: rgba(255,138,61,.12); }
.card.spent { opacity: .5; }
.card.other { opacity: .45; }
.card .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.4); border: 2px solid var(--cc, #888); color: var(--cc, #888); }
.card .ico svg { width: 18px; height: 18px; }
.card .nm { font: 600 12px/1.05 var(--f-head); letter-spacing: .03em; text-align: center; color: var(--ink); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .hp { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.card .hp b { display: block; height: 100%; background: var(--good); }
.card .ap { position: absolute; top: 5px; right: 5px; display: flex; flex-direction: column; gap: 3px; }
.card .ap i { width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 6px var(--ember); }
.card .ap i.used { background: rgba(255,255,255,.15); box-shadow: none; }
#actions { flex: 1; display: flex; justify-content: center; align-items: flex-end; min-width: 0; }
.bar { display: flex; gap: 6px; padding: 7px; flex-wrap: wrap; justify-content: center; }
.act { position: relative; width: 70px; min-height: 70px; border-radius: 2px; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); border: 1px solid var(--line); background: rgba(255,255,255,.04); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 6px 2px; }
.act svg { width: 26px; height: 26px; }
.act span { font: 600 11px/1.05 var(--f-head); letter-spacing: .02em; text-transform: uppercase; text-align: center; max-width: 66px; }
.act:not(:disabled):active { transform: scale(.96); background: rgba(255,138,61,.18); }
.act:disabled { opacity: .32; cursor: default; }
.act .n { position: absolute; top: 4px; right: 6px; font: 700 11px/1 var(--f-head); color: var(--ember-hi); }
.act .cost { position: absolute; top: 6px; left: 7px; display: flex; gap: 2px; }
.act .cost b { width: 5px; height: 5px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 4px var(--ember); }
.act:disabled .cost b { background: rgba(255,255,255,.3); box-shadow: none; }
.act.primary { border-color: var(--ember); background: linear-gradient(180deg, rgba(255,138,61,.3), rgba(255,138,61,.12)); }
.act.move { border-color: var(--move); background: rgba(79,176,247,.18); }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(118px + var(--sab)); padding: 8px 14px; font: 600 13px/1.2 var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .2s; }
#hint.show { opacity: 1; }
#endturn { align-self: flex-end; min-width: 110px; height: 70px; border-radius: 2px; clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); border: 1px solid var(--line-hi); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 13px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; }
#endturn svg { width: 22px; height: 22px; }
#endturn.armed { border-color: var(--ember); color: var(--ember-hi); background: rgba(255,138,61,.16); }
#endturn:disabled { opacity: .35; }

/* shot panel */
.shot { display: flex; gap: 14px; padding: 12px 14px; align-items: stretch; max-width: min(720px, 94vw); }
.shot .who { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 120px; }
.shot .who .k { font: 600 11px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.shot .who .nm { font: 700 20px/1 var(--f-head); letter-spacing: .04em; text-transform: uppercase; }
.shot .who .cyc { display: flex; gap: 6px; }
.shot .who .cyc button { width: 50px; height: 44px; border-radius: 8px; border: 1px solid var(--line-hi); background: rgba(255,255,255,.04); display: grid; place-items: center; }
.shot .who .cyc svg { width: 16px; height: 16px; }
.shot .big { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 110px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 12px; }
.shot .big .pct { font: 800 52px/0.9 var(--f-head); color: var(--ink); font-variant-numeric: tabular-nums; }
.shot .big .pct small { font-size: 24px; color: var(--muted); }
.shot .big .lab { font: 600 11px/1 var(--f-head); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.shot .stats { display: grid; grid-template-columns: auto auto; gap: 3px 14px; align-content: center; font-size: 14px; min-width: 150px; }
.shot .stats .l { color: var(--muted); }
.shot .stats .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.shot .stats .v.neg { color: #ff9a8f; }
.shot .stats .v.pos { color: var(--good); }
.shot .stats .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 3px 0; }
.shot .go { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 2px; border: 1px solid var(--line-hi); background: linear-gradient(180deg, rgba(140,180,255,.09), rgba(140,180,255,.03)); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); font: 700 15px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.fire { min-width: 130px; min-height: 58px; font-size: 19px; border: none; color: #1b0d04; background: linear-gradient(180deg, var(--ember-hi), var(--ember)); box-shadow: 0 4px 18px rgba(255,138,61,.35); }
.btn.fire:disabled { filter: grayscale(1); opacity: .5; }
.btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.btn:active { transform: scale(.97); }
.flank { color: var(--warn); font: 700 11px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; }

#toast { position: fixed; left: 50%; top: calc(84px + var(--sat)); transform: translateX(-50%); padding: 10px 16px; font: 600 14px/1.3 var(--f-head); letter-spacing: .05em; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 80vw; text-align: center; z-index: 30; }
#toast.show { opacity: 1; }
#infocard { position: absolute; right: calc(12px + var(--sar)); top: calc(72px + var(--sat)); width: 240px; padding: 12px 14px; }
#infocard .nm { font: 700 18px/1 var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--pale); }
#infocard p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
#infocard .row { display: flex; gap: 12px; margin-top: 8px; font: 600 13px/1 var(--f-head); letter-spacing: .06em; text-transform: uppercase; }

/* ---------- full screens (title, base, squad, debrief) ---------- */
#screen { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#screen[hidden] { display: none; }
#screen.dim { background: linear-gradient(90deg, rgba(5,8,15,.94) 0%, rgba(5,8,15,.84) 40%, rgba(5,8,15,.3) 56%, rgba(5,8,15,0) 68%); }
@media (max-width: 900px) { #screen.dim { background: rgba(5,8,15,.86); } }
.wrap { max-width: 640px; margin: 0; padding: calc(20px + var(--sat)) max(16px, calc(20px + var(--sar))) calc(28px + var(--sab)) max(16px, calc(20px + var(--sal))); display: flex; flex-direction: column; gap: 18px; min-height: 100%; box-sizing: border-box; }
.title { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(28px + var(--sat)) max(20px, calc(40px + var(--sar))) calc(40px + var(--sab)) max(20px, calc(40px + var(--sal))); box-sizing: border-box; background: linear-gradient(90deg, rgba(4,6,12,.88) 0%, rgba(4,6,12,.5) 38%, rgba(4,6,12,0) 65%), linear-gradient(0deg, rgba(4,6,12,.75), rgba(4,6,12,0) 45%); }
.logo { font: 400 clamp(38px, 6.4vw, 72px)/1.02 var(--f-logo); letter-spacing: .08em; color: var(--ink); text-shadow: 0 4px 30px rgba(0,0,0,.6); }
.logo em { font-style: normal; color: var(--ember); }
/* the wordmark: emblem, a small FAR over a wide EMBER in the ember gradient, and a tag line between rules */
.brand { display: flex; align-items: center; gap: 22px; }
.brand .emblem { flex: none; filter: drop-shadow(0 0 18px rgba(255,138,61,.35)); }
.brand .word { display: flex; flex-direction: column; }
.brand .far { font: 400 clamp(16px, 2vw, 22px)/1 var(--f-logo); letter-spacing: .9em; color: #ffd9a8; margin-left: .2em; }
.brand .ember { font: 400 clamp(52px, 8.4vw, 96px)/1 var(--f-logo); letter-spacing: .1em; margin: 4px 0 2px -.04em;
  background: linear-gradient(180deg, #fff4e0 0%, #ffc98a 38%, #ff8a3d 70%, #c4521c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 22px rgba(255,120,40,.28)); }
.brand .sub { display: flex; align-items: center; gap: 12px; font: 600 12px/1 var(--f-head); letter-spacing: .42em; text-transform: uppercase; color: var(--muted); }
.brand .sub::before, .brand .sub::after { content: ''; height: 1px; width: 36px; background: linear-gradient(90deg, transparent, var(--ember)); }
.brand .sub::after { background: linear-gradient(90deg, var(--ember), transparent); }
.brand.small { gap: 14px; }
.brand.small .ember { font-size: 40px; }
.brand.small .far { font-size: 12px; }
.tagline { margin-top: 14px; max-width: 30em; font-size: 16px; line-height: 1.5; color: #cfcab9; text-wrap: balance; }
.menu { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
.menu .btn { justify-content: flex-start; min-height: 54px; font-size: 17px; background: rgba(12,16,14,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.menu .btn.main { color: #1b0d04; border: none; background: linear-gradient(180deg, var(--ember-hi), var(--ember)); }
.menu .btn small { margin-left: auto; font: 500 12px/1 var(--f-body); letter-spacing: 0; text-transform: none; opacity: .75; }
.foot { margin-top: 26px; font-size: 12px; color: var(--dim); }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font: 800 34px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; }
.head h1 small { display: block; font: 600 12px/1 var(--f-head); letter-spacing: .22em; color: var(--ember-hi); margin-bottom: 6px; }
.meters { display: flex; gap: 10px; flex-wrap: wrap; }
.meter { padding: 9px 12px; min-width: 150px; }
.meter .k { font: 600 11px/1 var(--f-head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.meter .v { margin-top: 5px; font: 700 22px/1 var(--f-head); font-variant-numeric: tabular-nums; }
.meter .track { margin-top: 7px; display: flex; gap: 3px; }
.meter .track i { flex: 1; height: 6px; border-radius: 1px; background: rgba(255,255,255,.12); }
.meter .track i.on { background: var(--ember); }
.meter.threat .track i.on { background: var(--bad); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 1; min-height: 46px; border: none; background: none; border-radius: 7px; font: 700 14px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; padding: 0 12px; }
.tabs button.on { background: rgba(255,138,61,.16); color: var(--ember-hi); }
.tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); margin-left: 6px; vertical-align: middle; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.pic { position: relative; flex: none; width: 54px; height: 66px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-hi); box-shadow: inset 0 -3px 0 var(--cc); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic i { position: absolute; right: 2px; bottom: 5px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.65); color: var(--cc); display: grid; place-items: center; }
.pic i svg { width: 11px; height: 11px; }
.card .face { position: relative; width: 44px; height: 50px; border-radius: 6px; overflow: hidden; border: 1px solid var(--cc, #888); }
.card .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .face i { position: absolute; right: 1px; bottom: 1px; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.7); color: var(--cc); display: grid; place-items: center; }
.card .face i svg { width: 10px; height: 10px; }
.op { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.op .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.op .where { font: 600 12px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.op h3 { margin: 0; font: 700 21px/1.05 var(--f-head); letter-spacing: .03em; }
.op p { margin: 0; font-size: 14px; line-height: 1.45; color: #cfcab9; }
.op .facts { display: flex; gap: 16px; flex-wrap: wrap; font: 600 13px/1 var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.op .facts b { color: var(--ink); }
/* missions as a full-height column of big cards, each edged in its time of day */
